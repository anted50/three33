services:
  postgres:
    image: postgres:16-alpine
    container_name: uppercut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uppercut
      POSTGRES_PASSWORD: uppercut
      POSTGRES_DB: uppercut
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uppercut -d uppercut"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: uppercut-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the media bucket and makes it publicly readable,
  # so <img src> works without signed URLs. Exits after it runs.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/uppercut-media &&
      mc anonymous set download local/uppercut-media
      "

volumes:
  postgres-data:
  minio-data:
