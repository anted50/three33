services:
  postgres:
    image: postgres:16-alpine
    container_name: uppercut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uppercut
      POSTGRES_PASSWORD: uppercut
      POSTGRES_DB: uppercut
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uppercut -d uppercut"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  postgres-data:
