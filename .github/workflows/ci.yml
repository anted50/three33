name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catches a schema.ts edit that was never turned into a migration:
      # generating against a schema that matches writes nothing.
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            git status --porcelain drizzle/
            echo "src/db/schema.ts has changes with no migration — run npm run db:generate"
            exit 1
          fi

      # The same SQL `wrangler d1 migrations apply --remote` will run, applied
      # to a throwaway local D1. No Cloudflare account involved.
      - name: Migrations apply to D1
        run: npx wrangler d1 migrations apply DB --local

      # Before typecheck, not after: src/routeTree.gen.ts is generated by the
      # TanStack Start vite plugin and is gitignored, so a fresh checkout has
      # no route tree. Without it every createFileRoute() loses its route id
      # and tsc reports dozens of cascading errors across every route file.
      # The build has to run in CI regardless, so this costs nothing but the
      # order of the steps.
      - run: npm run build

      - run: npm run typecheck

      # unit + d1: the d1 project runs the database code against a local D1
      # (wrangler's getPlatformProxy), so it needs workerd but no account.
      - run: npm test
