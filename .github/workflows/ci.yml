name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uppercut
          POSTGRES_PASSWORD: uppercut
          POSTGRES_DB: uppercut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uppercut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://uppercut:uppercut@localhost:5432/uppercut_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catches a schema.ts edit that was never turned into a migration.
      - name: Apply migrations
        run: npm run db:migrate

      # Before typecheck, not after: src/routeTree.gen.ts is generated by the
      # TanStack Start vite plugin and is gitignored, so a fresh checkout has
      # no route tree. Without it every createFileRoute() loses its route id
      # and tsc reports dozens of cascading errors across every route file.
      # The build has to run in CI regardless, so this costs nothing but the
      # order of the steps.
      - run: npm run build

      - run: npm run typecheck

      - run: npm test
