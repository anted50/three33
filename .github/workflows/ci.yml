name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uppercut
          POSTGRES_PASSWORD: uppercut
          POSTGRES_DB: uppercut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uppercut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://uppercut:uppercut@localhost:5432/uppercut_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catches a schema.ts edit that was never turned into a migration.
      - name: Apply migrations
        run: npm run db:migrate

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
