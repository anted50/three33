name: CI and deploy

# Every pull request and every push is verified. A push to `staging` then
# deploys staging (staging.three33barber.com); a push to `production` deploys
# production (three33barber.com). Nothing deploys unless verify passed.
#
#   feature/* ──PR──▶ staging ──PR──▶ production
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN               Workers + D1 edit on the account
#   CLOUDFLARE_ACCOUNT_ID
#   VITE_PUBLIC_POSTHOG_PROJECT_TOKEN  baked into the client at build time
#   VITE_PUBLIC_POSTHOG_HOST
# The app's own secrets (QPay, StorePay, Resend…) live on the Workers and
# never pass through CI. See docs/deploy-cloudflare.md.
#
# Hardening, because the deploy jobs hold the Cloudflare token:
#   - Actions are pinned to a full commit SHA, not a tag. A tag can be moved
#     to other code; a SHA cannot. The comment names the release, and
#     .github/dependabot.yml opens a PR when a new one comes out.
#   - The job token can only read the repo. Nothing here pushes, comments or
#     writes a release.
#   - checkout does not leave that token in .git/config for later steps.
#   - Every job has a timeout. The whole run takes about 1.5 minutes, so 15
#     only stops one that has hung.

on:
  push:
    branches: [staging, production]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel a superseded check, but never a deploy halfway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Catches a schema.ts edit that was never turned into a migration:
      # generating against a schema that matches writes nothing.
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            git status --porcelain drizzle/
            echo "src/db/schema.ts has changes with no migration — run npm run db:generate"
            exit 1
          fi

      # The same SQL the deploy jobs apply remotely, on a throwaway local D1.
      - name: Migrations apply to D1
        run: npx wrangler d1 migrations apply DB --local

      # Builds and dry-runs both environments (nothing is uploaded), then
      # type-checks and runs the unit + D1 tests. Same command as locally.
      - run: npm run verify

  deploy-staging:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.three33barber.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Database first, so the code that needs a new column finds it.
      - run: npm run db:migrate:staging
      - run: npm run deploy:staging

  deploy-production:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers to this environment (Settings → Environments →
    # production) to make every production deploy wait for an approval.
    environment:
      name: production
      url: https://three33barber.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:remote
      - run: npm run deploy
